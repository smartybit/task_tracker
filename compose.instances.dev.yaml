name: ${INSTANCE_ID:?Set INSTANCE_ID in the instance env file}
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_tracker_instance}
      POSTGRES_USER: ${POSTGRES_USER:-task_tracker_instance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set an instance database password}
    volumes:
      - instance-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    image: ${INSTANCE_ID}-web:${INSTANCE_VERSION:-local}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      APP_ENV: development
      DJANGO_DEBUG: "true"
      APP_BASE_PATH: ${APP_BASE_PATH:-/}
      INSTANCE_ID: ${INSTANCE_ID}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set an instance Django secret}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:${FRONTEND_PORT:?Set a distinct loopback frontend port},http://127.0.0.1:${FRONTEND_PORT}
      POSTGRES_DB: ${POSTGRES_DB:-task_tracker_instance}
      POSTGRES_USER: ${POSTGRES_USER:-task_tracker_instance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      WORKING_TIME_ZONE: ${WORKING_TIME_ZONE:-UTC}
      UPLOAD_ROOT: /var/lib/task-tracker/uploads
    volumes:
      - instance-uploads:/var/lib/task-tracker/uploads
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver --noreload 0.0.0.0:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30
  frontend:
    image: ${INSTANCE_ID}-frontend:${INSTANCE_VERSION:-local}
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        APP_BASE_PATH: ${APP_BASE_PATH:-/}
        INSTANCE_ID: ${INSTANCE_ID}
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:5173"
    environment:
      APP_BASE_PATH: ${APP_BASE_PATH:-/}
      INSTANCE_ID: ${INSTANCE_ID}
      FRONTEND_PORT: ${FRONTEND_PORT}
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173' + (process.env.APP_BASE_PATH.endsWith('/') ? process.env.APP_BASE_PATH : process.env.APP_BASE_PATH + '/')).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  instance-db:
  instance-uploads:
